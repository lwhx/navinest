name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type and framework checks
        run: npm run check
      - name: Unit and integration tests
        run: npm run test
      - name: Install browser for homepage checks
        run: npx playwright install --with-deps chromium
      - name: Install Chinese fonts for layout checks
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Homepage SSR and responsive layouts
        env:
          NAVINEST_REQUIRE_CJK: '1'
          NAVINEST_SCREENSHOT_DIR: ${{ runner.temp }}/navinest-layout
        run: npm run test:home-layout
      - name: Upload homepage layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-layout
          path: ${{ runner.temp }}/navinest-layout
          if-no-files-found: ignore
      - name: Build without rewriting the Worker entrypoint
        shell: bash
        run: |
          before="$(sha256sum cloudflare/worker.ts | cut -d' ' -f1)"
          npm run build
          after="$(sha256sum cloudflare/worker.ts | cut -d' ' -f1)"
          test "$before" = "$after"
