name: Production smoke

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run anonymous read-only production smoke
        run: npm run --silent smoke:production > navinest-production-smoke.json
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navinest-production-smoke-${{ github.run_id }}
          path: navinest-production-smoke.json
          if-no-files-found: warn
          retention-days: 14
